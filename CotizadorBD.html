<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba de Botones Luxsolar</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f4f6f8; }
  .box { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; text-align: center; }
  button { padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; border: 1px solid #ccc; background: #1d4d6d; color: white; }
</style>
</head>
<body>

<div class="box">
  <h2>Prueba de Funcionamiento</h2>
  <p id="mensaje">Presiona el botón para probar si el navegador ejecuta los clics.</p>
  <button type="button" onclick="probar()">Probar Botón</button>
</div>

<script>
function probar() {
  document.getElementById('mensaje').innerHTML = "<b style='color: green;'>¡FUNCIONA! Los botones están respondiendo correctamente.</b>";
  alert("¡El botón respondió con éxito!");
}
</script>

</body>
</html>
