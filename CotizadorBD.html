<script>
var SUPABASE_URL = "https://tltrcrvobqkwftooipia.supabase.co";
var SUPABASE_KEY = "sb_publishable_1gGKb8X7fdjiUENMNKK4jA_MLrgxO47";

// Cambiamos el nombre para que NUNCA choque con la librería global
var sbClient = null;

var CATALOG = [];
var QUOTES_HISTORY = [];
var lines = [];

function money(n) {
  return new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(Number(n) || 0);
}

function today() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

window.addEventListener('DOMContentLoaded', function() {
  if (document.getElementById('qdate')) document.getElementById('qdate').value = today();
  if (document.getElementById('qnum')) document.getElementById('qnum').value = "222";
  if (document.getElementById('validUntil')) document.getElementById('validUntil').value = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
  if (!lines.length) addLine();
  
  setTimeout(initSupabase, 100);
});

function initSupabase() {
  try {
    if (window.supabase) {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      fetchCatalogFromCloud();
      fetchHistoryFromCloud();
    }
  } catch(e) {
    console.log("Error de conexión Supabase:", e);
  }
}

function showPage(id) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) {
    pages[i].classList.remove('active');
  }
  var p = document.getElementById(id);
  if (p) p.classList.add('active');
  if (id === 'history') renderHistory();
  if (id === 'catalog') renderCatalog();
}

function nextNum() {
  return String(222 + QUOTES_HISTORY.length).padStart(3, '0');
}

async function fetchCatalogFromCloud() {
  if (!sbClient) return;
  try {
    var res = await sbClient.from('catalogo').select('*').order('id', { ascending: true });
    if (!res.error && res.data) {
      CATALOG = res.data;
      renderCatalog();
    }
  } catch(e){}
}

async function fetchHistoryFromCloud() {
  if (!sbClient) return;
  try {
    var res = await sbClient.from('cotizaciones').select('*').order('created_at', { ascending: false });
    if (!res.error && res.data) {
      QUOTES_HISTORY = res.data;
      if (document.getElementById('qnum')) document.getElementById('qnum').value = nextNum();
      renderHistory();
    }
  } catch(e){}
}

function addLine(item) {
  lines.push({ item: item || null, qty: 1, price: item ? item.precio_neto : 0, iva: item ? !!item.iva : true });
  renderLines();
}

function removeLine(i) {
  lines.splice(i, 1);
  renderLines();
}

function renderLines() {
  var tb = document.getElementById('lines');
  if (!tb) return;
  tb.innerHTML = '';
  lines.forEach(function(l, i) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td class="line-search">' +
      '<input style="width:100%;padding:6px;border:1px solid #dfe4e8;border-radius:6px;font-size:13px" value="' + (l.item ? htmlEsc(l.item.descripcion) : '') + '" placeholder="Escribe para buscar..." oninput="suggest(' + i + ',this.value)" onblur="setTimeout(function(){closeSuggest(' + i + ')},200)">' +
      '<div id="sug' + i + '" class="suggestions" style="display:none"></div>' +
    '</td>' +
    '<td>' + (l.item ? l.item.codigo : '—') + '</td>' +
    '<td><input type="number" min="1" step="1" value="' + l.qty + '" style="width:60px;padding:5px" onchange="lines[' + i + '].qty=+this.value;calc()"></td>' +
    '<td><input type="number" min="0" value="' + l.price + '" style="width:100px;padding:5px" onchange="lines[' + i + '].price=+this.value;calc()"></td>' +
    '<td><label class="switch"><input type="checkbox" ' + (l.iva ? 'checked' : '') + ' onchange="lines[' + i + '].iva=this.checked;calc()"> Afecto</label></td>' +
    '<td class="num">' + money(l.qty * l.price) + '</td>' +
    '<td class="no-print"><button type="button" class="danger" onclick="removeLine(' + i + ')">×</button></td>';
    tb.appendChild(tr);
  });
  calc();
}

function htmlEsc(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function suggest(i, val) {
  var box = document.getElementById('sug' + i);
  if (!box) return;
  var q = val.toLowerCase().trim();
  if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
  var arr = CATALOG.filter(function(p) {
    return (p.descripcion + ' ' + p.codigo + ' ' + p.categoria).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 8);
  if (arr.length === 0) { box.style.display = 'none'; return; }
  
  box.style.display = 'block';
  box.innerHTML = arr.map(function(p) {
    return '<div onclick=\'pick(' + i + ', "' + p.codigo + '")\'><b>' + htmlEsc(p.codigo) + '</b> — ' + htmlEsc(p.descripcion) + '<br><small style="color:var(--muted)">' + htmlEsc(p.categoria) + ' · ' + money(p.precio_neto) + '</small></div>';
  }).join('');
}

function closeSuggest(i) {
  var box = document.getElementById('sug' + i);
  if (box) box.style.display = 'none';
}

function pick(i, codigo) {
  var p = CATALOG.find(function(x) { return x.codigo === codigo; });
  if (p) {
    lines[i] = { item: p, qty: lines[i].qty || 1, price: p.precio_neto, iva: !!p.iva };
    renderLines();
  }
}

function calc() {
  var a = 0, e = 0;
  lines.forEach(function(l) {
    var n = (+l.qty || 0) * (+l.price || 0);
    if (l.iva) { a += n; } else { e += n; }
  });
  var vat = Math.round(a * 0.19);
  var total = a + e + vat;
  if (document.getElementById('taxable')) document.getElementById('taxable').textContent = money(a);
  if (document.getElementById('exempt')) document.getElementById('exempt').textContent = money(e);
  if (document.getElementById('vat')) document.getElementById('vat').textContent = money(vat);
  if (document.getElementById('grand')) document.getElementById('grand').textContent = money(total);
  return { a: a, e: e, vat: vat, total: total };
}

function getFormData() {
  return {
    num: document.getElementById('qnum').value,
    date: document.getElementById('qdate').value,
    client: document.getElementById('client').value,
    client_id: document.getElementById('clientId').value,
    advisor: document.getElementById('advisor').value,
    valid_until: document.getElementById('validUntil').value,
    lines: lines,
    totals: calc()
  };
}

async function saveQuote() {
  if (!sbClient) return alert("Conectando con la base de datos en la nube...");
  var d = getFormData();
  var res = await sbClient.from('cotizaciones').upsert(d, { onConflict: 'num' });
  if (res.error) {
    alert('Error al guardar en la nube: ' + res.error.message);
  } else {
    alert('Cotización guardada exitosamente en la nube.');
    fetchHistoryFromCloud();
  }
}

function clearQuote() {
  if (confirm('¿Crear una nueva cotización? Se limpiarán los datos actuales.')) {
    lines = [];
    document.getElementById('client').value = '';
    document.getElementById('clientId').value = '';
    document.getElementById('qnum').value = nextNum();
    document.getElementById('qdate').value = today();
    document.getElementById('validUntil').value = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
    addLine();
  }
}

async function printQuote() {
  if (!lines.length) return alert('Agrega al menos un producto.');
  if (sbClient) await saveQuote();
  window.print();
}

function renderHistory() {
  var q = (document.getElementById('histSearch')?.value || '').toLowerCase();
  var h = QUOTES_HISTORY.filter(function(x) {
    return (x.num + ' ' + x.client).toLowerCase().indexOf(q) !== -1;
  });
  var el = document.getElementById('historyRows');
  if (!el) return;
  el.innerHTML = h.map(function(x) {
    return '<tr>' +
      '<td>' + x.num + '</td>' +
      '<td>' + (x.date || '') + '</td>' +
      '<td>' + htmlEsc(x.client || '') + '</td>' +
      '<td>' + money(x.totals?.total || 0) + '</td>' +
      '<td class="actions">' +
        '<button type="button" onclick=\'loadQuote("' + x.num + '")\'>Abrir</button>' +
        '<button type="button" class="danger" onclick=\'deleteQuote("' + x.num + '")\' title="Eliminar cotización">×</button>' +
      '</td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="5" class="empty">No hay cotizaciones guardadas.</td></tr>';
}

function loadQuote(num) {
  var x = QUOTES_HISTORY.find(function(q) { return q.num === num; });
  if (!x) return;
  document.getElementById('qnum').value = x.num;
  document.getElementById('qdate').value = x.date;
  document.getElementById('client').value = x.client || '';
  document.getElementById('clientId').value = x.client_id || '';
  document.getElementById('advisor').value = x.advisor || '';
  document.getElementById('validUntil').value = x.valid_until || '';
  lines = x.lines || [];
  showPage('quote');
  renderLines();
}

async function deleteQuote(num) {
  if (confirm('¿Estás seguro de que deseas eliminar la cotización N° ' + num + ' de la nube?')) {
    var res = await sbClient.from('cotizaciones').delete().eq('num', num);
    if (!res.error) {
      fetchHistoryFromCloud();
    } else {
      alert('Error al eliminar: ' + res.error.message);
    }
  }
}

function renderCatalog() {
  var q = (document.getElementById('catSearch')?.value || '').toLowerCase();
  var filtered = CATALOG.filter(function(p) {
    return (p.codigo + ' ' + p.categoria + ' ' + p.descripcion).toLowerCase().indexOf(q) !== -1;
  });

  var html = '' +
    '<tr class="new-row no-print">' +
      '<td><input class="edit-inp" id="newCode" placeholder="Código"></td>' +
      '<td><input class="edit-inp" id="newCat" placeholder="Categoría"></td>' +
      '<td><input class="edit-inp" id="newDesc" placeholder="Descripción del producto"></td>' +
      '<td><input class="edit-inp" type="number" min="0" id="newPrice" placeholder="Precio CLP"></td>' +
      '<td>' +
        '<select class="edit-inp" id="newIva">' +
          '<option value="true">Sí</option>' +
          '<option value="false">No</option>' +
        '</select>' +
      '</td>' +
      '<td class="actions">' +
        '<button type="button" class="success" style="width:100%;" onclick="addNewProduct()">+ Añadir</button>' +
      '</td>' +
    '</tr>';

  if (filtered.length === 0) {
    html += '<tr><td colspan="6" class="empty">No se encontraron productos.</td></tr>';
  } else {
    filtered.forEach(function(p) {
      html += '' +
        '<tr>' +
          '<td><input class="edit-inp" id="c_code_' + p.id + '" value="' + htmlEsc(p.codigo) + '"></td>' +
          '<td><input class="edit-inp" id="c_cat_' + p.id + '" value="' + htmlEsc(p.categoria) + '"></td>' +
          '<td><input class="edit-inp" id="c_desc_' + p.id + '" value="' + htmlEsc(p.descripcion) + '"></td>' +
          '<td><input class="edit-inp" type="number" min="0" id="c_price_' + p.id + '" value="' + p.precio_neto + '"></td>' +
          '<td>' +
            '<select class="edit-inp" id="c_iva_' + p.id + '">' +
              '<option value="true" ' + (p.iva ? 'selected' : '') + '>Sí</option>' +
              '<option value="false" ' + (!p.iva ? 'selected' : '') + '>No</option>' +
            '</select>' +
          '</td>' +
          '<td class="no-print actions">' +
            '<button type="button" class="primary" onclick="updateProduct(' + p.id + ')">Guardar</button>' +
            '<button type="button" class="danger" onclick="deleteProduct(' + p.id + ')">×</button>' +
          '</td>' +
        '</tr>';
    });
  }

  var el = document.getElementById('catalogRows');
  if (el) el.innerHTML = html;
}

async function updateProduct(id) {
  var code = document.getElementById('c_code_' + id).value.trim();
  var cat = document.getElementById('c_cat_' + id).value.trim();
  var desc = document.getElementById('c_desc_' + id).value.trim();
  var price = parseFloat(document.getElementById('c_price_' + id).value);
  var iva = document.getElementById('c_iva_' + id).value === "true";

  if (!code || !cat || !desc || isNaN(price)) return alert('Completa todos los campos.');

  var res = await sbClient.from('catalogo').update({ codigo: code, categoria: cat, descripcion: desc, precio_neto: price, iva: iva }).eq('id', id);
  if (res.error) alert('Error: ' + res.error.message);
  else {
    alert('Producto actualizado en la nube.');
    fetchCatalogFromCloud();
  }
}

async function addNewProduct() {
  var code = document.getElementById('newCode').value.trim();
  var cat = document.getElementById('newCat').value.trim();
  var desc = document.getElementById('newDesc').value.trim();
  var price = parseFloat(document.getElementById('newPrice').value);
  var iva = document.getElementById('newIva').value === "true";

  if (!code || !cat || !desc || isNaN(price)) return alert('Completa todos los campos para agregar.');

  var res = await sbClient.from('catalogo').insert([{ codigo: code, categoria: cat, descripcion: desc, precio_neto: price, iva: iva }]);
  if (res.error) alert('Error: ' + res.error.message);
  else {
    alert('Producto agregado al catálogo en la nube.');
    fetchCatalogFromCloud();
  }
}

async function deleteProduct(id) {
  if (confirm('¿Eliminar este producto del catálogo en la nube?')) {
    var res = await sbClient.from('catalogo').delete().eq('id', id);
    if (!res.error) fetchCatalogFromCloud();
    else alert('Error: ' + res.error.message);
  }
}
</script>
